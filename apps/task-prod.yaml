apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-prod
  namespace: argocd
spec:
  project: default
  source:
    # Gerrit on the host; host.docker.internal is Docker Desktop's name for it.
    repoURL: http://host.docker.internal:8080/task-config
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: task-prod
  syncPolicy:
    automated:
      prune: true      # delete what was removed from Git
      selfHeal: true   # undo changes made by hand with kubectl
