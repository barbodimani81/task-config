apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-dev
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: task
    count: 1
images:
  - name: task-app
    newName: ghcr.io/barbodimani81/task-app
    newTag: 5f7657a
  - name: task-migrate
    newName: ghcr.io/barbodimani81/task-migrate
    newTag: 5f7657a
configMapGenerator:
  - name: task-config
    behavior: merge
    literals:
      - APP_ENV=dev
