apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-prod
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: task
    count: 3
images:
  - name: task-app
    newName: ghcr.io/barbodimani81/task-app
    newTag: 527fa8b
  - name: task-migrate
    newName: ghcr.io/barbodimani81/task-migrate
    newTag: 527fa8b
configMapGenerator:
  - name: task-config
    behavior: merge
    literals:
      - APP_ENV=prod
